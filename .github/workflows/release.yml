name: Release

# Tag-driven. Update the version, tag it, push the tag:
#
#   npm version 1.0.0 -m "Release %s"
#   git push origin main --follow-tags
#
# This builds, tests, packages, and attaches the .vsix to a GitHub Release.
# It deliberately does NOT publish to the VS Code Marketplace - see
# docs/DEVELOPMENT.md for why, and for the manual publish step.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # required to create the Release and upload the asset

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Compile
        run: npm run build

      - name: Test
        run: npm test

      - name: Resolve version
        id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION"       >> "$GITHUB_OUTPUT"
          echo "vsix=ti99-dev-suite-$PKG_VERSION.vsix" >> "$GITHUB_OUTPUT"
          # A tag that disagrees with package.json produces a release whose
          # asset version does not match its name. Fail loudly instead.
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION."
            exit 1
          fi

      - name: Package
        run: npx vsce package --out ${{ steps.v.outputs.vsix }}

      - name: Verify the package
        shell: bash
        run: |
          test -f "${{ steps.v.outputs.vsix }}" || { echo "::error::no .vsix produced"; exit 1; }
          npx vsce ls --tree

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          files: ${{ steps.v.outputs.vsix }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
          body: |
            Install from the attached `.vsix`:

            ```
            code --install-extension ${{ steps.v.outputs.vsix }}
            ```

            Or in VS Code: Extensions view → `...` → **Install from VSIX...**

            See [changelog.md](https://github.com/kenfitz/ti99-dev-suite/blob/main/changelog.md) for what changed.
